<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Nexo Global Vacations | Bespoke Luxury Travel & Tourism Agency</title>

    <meta
      name="description"
      content="Nexo Global Vacations offers premium and bespoke travel experiences, luxury vacations, personalized tours and unforgettable journeys around the world."
    />

    <meta
      name="keywords"
      content="Nexo Global Vacations, luxury travel, luxury vacations, travel agency, tourism, bespoke travel, holiday packages, international tours"
    />

    <meta name="author" content="Nexo Global Vacations" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://itinearary.com/" />

    <!-- Theme -->
    <meta name="theme-color" content="#0b1f3a" />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Nexo Global Vacations | Bespoke Luxury Travel"
    />
    <meta
      property="og:description"
      content="Discover premium, personalized travel experiences with Nexo Global Vacations."
    />
    <meta property="og:url" content="https://itinearary.com/" />
    <meta property="og:site_name" content="Nexo Global Vacations" />

    <!--
      Later, when we have a proper social preview image,
      add:
      <meta property="og:image" content="https://itinearary.com/og-image.jpg" />
    -->

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Nexo Global Vacations | Bespoke Luxury Travel"
    />
    <meta
      name="twitter:description"
      content="Premium and personalized travel experiences around the world."
    />

    <!-- Google Site Name / Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Nexo Global Vacations",
        "alternateName": "itinearary.com",
        "url": "https://itinearary.com/"
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-pearl font-sans text-primary antialiased selection:bg-gold selection:text-primary-dark"
  >
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
